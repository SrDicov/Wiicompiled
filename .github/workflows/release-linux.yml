name: Release Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v0.3.0). Leave empty to use workflow run."
        required: false
        type: string

permissions:
  contents: write

jobs:
  translator:
    name: Translator (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore translator/Translator.sln
      - run: dotnet build translator/Translator.sln -c Release --no-restore
      - run: dotnet test translator/Translator.sln -c Release --no-build --verbosity normal

  package-glibc:
    name: Package setup (glibc)
    runs-on: ubuntu-latest
    needs: translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Linux setup (framework-dependent)
        run: |
          dotnet publish Launcher/WiiCompiled.Setup.Linux/WiiCompiled.Setup.Linux.csproj \
            -c Release -r linux-x64 --self-contained false -o dist/setup-linux-glibc
          cp Launcher/local-build.sh dist/setup-linux-glibc/
          cp Launcher/build-appimage.sh dist/setup-linux-glibc/ 2>/dev/null || true
          cp -r projects dist/setup-linux-glibc/projects 2>/dev/null || true
          cp README.md THIRD-PARTY-NOTICES.md dist/setup-linux-glibc/ 2>/dev/null || true
          tar -czf wii-compiled-setup-linux-glibc.tar.gz -C dist setup-linux-glibc
          tar -tzf wii-compiled-setup-linux-glibc.tar.gz | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: wii-compiled-setup-linux-glibc
          path: wii-compiled-setup-linux-glibc.tar.gz
          if-no-files-found: error

  package-musl:
    name: Package setup (musl)
    runs-on: ubuntu-latest
    needs: translator
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apk add --no-cache clang clang-extra-tools cmake bash git python3 curl unzip \
            musl-dev linux-headers gcc g++ binutils lld \
            abseil-cpp-dev wayland-dev wayland vulkan-headers vulkan-loader-dev sdl3-dev gcompat \
            libxkbcommon-dev libxcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          curl -L https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip -o /tmp/ninja.zip
          unzip -o /tmp/ninja.zip -d /tmp && mv /tmp/ninja /usr/local/bin/ninja && chmod +x /usr/local/bin/ninja
          clang --version
          cmake --version
          /usr/local/bin/ninja --version
          dotnet --version
      - name: Publish Linux setup (musl, framework-dependent)
        run: |
          dotnet publish Launcher/WiiCompiled.Setup.Linux/WiiCompiled.Setup.Linux.csproj \
            -c Release -r linux-musl-x64 --self-contained false -o dist/setup-linux-musl
          cp Launcher/local-build.sh dist/setup-linux-musl/
          cp Launcher/build-appimage.sh dist/setup-linux-musl/ 2>/dev/null || true
          cp -r projects dist/setup-linux-musl/projects 2>/dev/null || true
          cp README.md THIRD-PARTY-NOTICES.md dist/setup-linux-musl/ 2>/dev/null || true
          tar -czf wii-compiled-setup-linux-musl.tar.gz -C dist setup-linux-musl
          tar -tzf wii-compiled-setup-linux-musl.tar.gz | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: wii-compiled-setup-linux-musl
          path: wii-compiled-setup-linux-musl.tar.gz
          if-no-files-found: error

  # Musl game build validation – proves the native toolchain compiles the
  # full runtime + Dawn vendor on musl (needs no game Assets, just the runtime).
  # This is the slow job (Dawn from source, ~15 min) – validates 100% musl compat.
  runtime-smoke-musl:
    name: Runtime smoke (musl, vendor Dawn)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apk add --no-cache clang clang-extra-tools cmake bash git python3 curl unzip \
            musl-dev linux-headers gcc g++ binutils lld \
            abseil-cpp-dev wayland-dev wayland vulkan-headers vulkan-loader-dev sdl3-dev gcompat \
            libxkbcommon-dev libxcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          curl -L https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip -o /tmp/ninja.zip
          unzip -o /tmp/ninja.zip -d /tmp && mv /tmp/ninja /usr/local/bin/ninja && chmod +x /usr/local/bin/ninja
          clang --version; cmake --version; /usr/local/bin/ninja --version
      - name: Verify Dawn vendor configures on musl
        run: |
          cmake -S runtime -B /tmp/rt-smoke-musl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_MAKE_PROGRAM=/usr/local/bin/ninja \
            -DAURORA_DAWN_PROVIDER=vendor -DAURORA_DAWN_VERSION=v20260827.013930 2>&1 | tail -30
          echo "Musl vendor CMake OK"

  # Full game build smoke (glibc) – translator + runtime compile without Assets
  # is not possible; this job only validates that the native CMake still
  # configures on a clean glibc runner (no Assets needed for the runtime-only
  # helper). The real game build is exercised locally via the setup package.
  runtime-smoke-glibc:
    name: Runtime smoke (glibc, no Assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - run: cmake --version && clang --version
      - name: Verify runtime CMake configures (without game Assets)
        run: |
          # Only check that the Linux CMake guard accepts this host; the full
          # game build needs Assets/main.dol and is done via local-build.sh.
          cmake -S runtime -B /tmp/rt-smoke -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DAURORA_DAWN_PROVIDER=package 2>&1 | tail -20
          echo "CMake configure OK (package provider)"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [translator, package-glibc, package-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - run: ls -R artifacts
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "value=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: WiiCompiled Linux ${{ steps.tag.outputs.value }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/wii-compiled-setup-linux-glibc/wii-compiled-setup-linux-glibc.tar.gz
            artifacts/wii-compiled-setup-linux-musl/wii-compiled-setup-linux-musl.tar.gz
