name: Build Game AppImage (glibc Anylinux)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (base only for now; retro needs Code.pul)"
        required: false
        default: "base"
        type: choice
        options: [base]
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "aurora-main/**"
      - "Launcher/build-game-appimage.sh"
      - ".github/workflows/build-game-appimage.yml"
      - "projects/mkwii/recomp.yml"

permissions:
  contents: read

jobs:
  game-appimage:
    name: WiiCompiled glibc Anylinux AppImage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + game deps
        run: |
          pacman -Syu --noconfirm \
            base-devel clang cmake ninja patchelf git python3 wget curl unzip zsync \
            dotnet-sdk-8.0 xorg-server-xvfb \
            sdl3 vulkan-icd-loader vulkan-headers mesa \
            libpng zlib libx11 libxcursor libxrandr libxi libxkbcommon \
            libxcb xcb-util-wm abseil-cpp wayland wayland-protocols || \
          pacman -S --noconfirm \
            base-devel clang cmake ninja patchelf git python3 wget curl unzip zsync \
            dotnet-sdk-8.0 xorg-server-xvfb \
            sdl3 vulkan-icd-loader vulkan-headers mesa \
            libpng zlib libx11 libxcursor libxrandr libxi libxkbcommon \
            libxcb xcb-util-wm abseil-cpp wayland wayland-protocols
          clang --version; cmake --version; ninja --version; dotnet --version; dotnet --list-runtimes | head -10
          vulkaninfo --summary 2>&1 | head -20 || true

      - name: Restore game Assets from cache (if any)
        id: assets
        run: |
          if [ -f Assets/main.dol ] && [ -f Assets/StaticR.rel ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
            sha256sum Assets/main.dol Assets/StaticR.rel | head -2
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Assets/main.dol+StaticR.rel in checkout - will try release asset"
          fi

      - name: Download Assets from private release (if missing)
        if: steps.assets.outputs.has_assets == 'false'
        run: |
          echo "Downloading Assets from release assets-tmp..."
          curl -L https://github.com/SrDicov/Wiicompiled/releases/download/assets-tmp/assets.tgz -o /tmp/assets.tgz
          tar -xzf /tmp/assets.tgz -C .
          ls -lh Assets/main.dol Assets/StaticR.rel
          sha256sum Assets/main.dol Assets/StaticR.rel | head -2
          echo "has_assets=true" >> "$GITHUB_ENV"

      - name: Re-check Assets
        id: assets2
        run: |
          if [ -f Assets/main.dol ] && [ -f Assets/StaticR.rel ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
            sha256sum Assets/main.dol Assets/StaticR.rel | head -2
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build translator
        run: dotnet build translator/Translator.sln -c Release

      - name: Translate + native build (glibc, package Dawn)
        if: steps.assets.outputs.has_assets == 'true' || steps.assets2.outputs.has_assets == 'true'
        run: |
          Launcher/local-build.sh --output-dir ./native-build-out --build-dir ./native-build --profile base 2>&1 | tee /tmp/local-build.log
          ls -lh native-build/WiiCompiled native-build-out/WiiCompiled 2>&1 | head -5
          ldd native-build/WiiCompiled 2>&1 | head -20

      - name: Fallback - CMake runtime only (no Assets)
        if: steps.assets.outputs.has_assets == 'false' && steps.assets2.outputs.has_assets == 'false'
        run: |
          echo "::warning::No Assets even after release download - dummy AppImage"
          mkdir -p native-build
          cp /usr/bin/clang native-build/WiiCompiled 2>/dev/null || cp /bin/ls native-build/WiiCompiled || echo "#!/bin/sh\necho dummy" > native-build/WiiCompiled
          chmod +x native-build/WiiCompiled

      - name: Build Anylinux AppImage (sharun)
        run: |
          chmod +x Launcher/build-game-appimage.sh
          # build-game-appimage.sh instala a /usr/bin/WiiCompiled y hace quick-sharun
          # Necesita DISPLAY para strace de dlopen, xorg-server-xvfb ya está
          ./Launcher/build-game-appimage.sh 2>&1 | tee /tmp/appimage.log
          ls -lh dist/*.AppImage
          sha256sum dist/*.AppImage | tee dist/SHA256SUM

      - name: Smoke test AppImage
        run: |
          set -eux
          ls -lh dist/
          # quick-sharun --test ya corrió dentro del script con xvfb; test extra sin FUSE (CI containers no tienen /dev/fuse)
          export APPIMAGE_EXTRACT_AND_RUN=1
          timeout 12 ./dist/WiiCompiled-glibc-*.AppImage --help 2>&1 | head -30 || echo "help exit code $?"
          if ./dist/WiiCompiled-glibc-*.AppImage --help 2>&1 | grep -qi "symbol lookup error\|error while loading shared libraries"; then
            echo "::error::AppImage missing libs"; exit 1
          fi
          echo "smoke ok"

      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-glibc-Anylinux-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUM
            /tmp/local-build.log
            /tmp/appimage.log
          if-no-files-found: error
